name: Feature request
description: Propose a change to the MIT Go client
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests for the AGPL proxy belong in [barzoj-co/llm-test-lab](https://github.com/barzoj-co/llm-test-lab).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the Go client does not support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
    validations:
      required: false
