name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: |
            go.mod
            examples/go/go.sum
            e2e/go.sum
      - name: go vet
        run: |
          go vet ./...
          (cd examples/go && go vet ./...)
          (cd e2e && go vet -tags=e2e ./...)
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Unit tests
        run: go test -covermode=atomic -coverprofile=coverage-unit.out ./...
      - name: Upload unit coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          files: ./coverage-unit.out
          flags: unit
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_E2E_MODEL: ${{ vars.OPENAI_E2E_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require secrets
        env:
          HAS_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN != '' }}
        run: |
          echo "LLMTESTLAB_REPO_TOKEN present: ${HAS_REPO_TOKEN}"
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is required for non-fork e2e runs"
            exit 1
          fi
          if [ "${HAS_REPO_TOKEN}" != "true" ]; then
            echo "::error::LLMTESTLAB_REPO_TOKEN is required to build the proxy from source"
            exit 1
          fi

      # TODO: switch to GitHub Release binaries from barzoj-co/llm-test-lab
      # (checksum-verified via llmtestlab.DownloadRelease) when that repository
      # is public. Until then, build the proxy from source like the Python/JS
      # clients: checkout with secrets.LLMTESTLAB_REPO_TOKEN.
      - name: Checkout llm-test-lab proxy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: barzoj-co/llm-test-lab
          token: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
          path: llm-test-lab
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: |
            go.mod
            examples/go/go.mod
            e2e/go.mod
            llm-test-lab/go.mod

      - name: Build proxy from source
        working-directory: llm-test-lab
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/bin/llm-test-lab" ./cmd/llmtestlab
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Integration tests (proxy + mock upstream)
        env:
          LLMTESTLAB_BIN: ${{ github.workspace }}/bin/llm-test-lab
        run: go test -v -count=1 -covermode=atomic -coverpkg=github.com/barzoj-co/llm-test-lab-go/... -coverprofile="${GITHUB_WORKSPACE}/coverage-integration.out" ./...
        working-directory: examples/go

      - name: Upload integration coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          files: ./coverage-integration.out
          flags: integration
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}

      - name: OpenAI e2e tests
        env:
          LLMTESTLAB_BIN: ${{ github.workspace }}/bin/llm-test-lab
        run: |
          set +e
          go test -v -tags=e2e -count=1 ./... | tee "${RUNNER_TEMP}/e2e.log"
          status=${PIPESTATUS[0]}
          echo "===== e2e tests that ran ====="
          grep -E '^=== RUN|^--- (PASS|FAIL|SKIP)' "${RUNNER_TEMP}/e2e.log" || true
          exit "$status"
        working-directory: e2e
