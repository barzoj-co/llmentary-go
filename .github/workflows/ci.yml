name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: |
            go.mod
            examples/go/go.sum
            e2e/go.sum
      - name: go vet
        run: |
          go vet ./...
          (cd examples/go && go vet ./...)
          (cd e2e && go vet -tags=e2e ./...)
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [integration]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
      - name: Unit tests
        run: go test -covermode=atomic -coverprofile=coverage-unit.out ./...
      - name: Upload unit coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: false
          disable_search: true
          files: ./coverage-unit.out
          flags: unit
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}
      - name: Download integration coverage
        if: ${{ needs.integration.result == 'success' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage-integration
          path: .
      - name: Coverage gate
        run: ./scripts/coverage-gate.sh

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: |
            go.mod
            examples/go/go.mod

      - name: Install pinned proxy release
        env:
          LLMENTARY_LIVE_DOWNLOAD: "1"
          LLMENTARY_LIVE_DOWNLOAD_DIR: ${{ github.workspace }}/bin
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go test -run 'TestDownloadPinnedProxyRelease|TestIsolationVectorsMatchPinnedProxy' -count=1 -v
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Integration tests (proxy + mock upstream)
        env:
          LLMENTARY_BIN: ${{ github.workspace }}/bin/llmentary
        run: go test -v -count=1 -covermode=atomic -coverpkg=github.com/barzoj-co/llmentary-go/... -coverprofile="${GITHUB_WORKSPACE}/coverage-integration.out" ./...
        working-directory: examples/go

      - name: Upload integration coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: false
          disable_search: true
          files: ./coverage-integration.out
          flags: integration
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}
      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: coverage-integration.out
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: e2e
    # Required reviewers are configured on this environment; integration does not use it.
    environment: openai-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    env:
      OPENAI_E2E_MODEL: ${{ vars.OPENAI_E2E_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require secrets
        env:
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          echo "OPENAI_API_KEY present: ${HAS_OPENAI_API_KEY}"
          if [ "${HAS_OPENAI_API_KEY}" != "true" ]; then
            echo "::error::OPENAI_API_KEY is required for non-fork e2e runs"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: |
            go.mod
            examples/go/go.mod
            e2e/go.mod

      - name: Install pinned proxy release
        env:
          LLMENTARY_LIVE_DOWNLOAD: "1"
          LLMENTARY_LIVE_DOWNLOAD_DIR: ${{ github.workspace }}/bin
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go test -run 'TestDownloadPinnedProxyRelease|TestIsolationVectorsMatchPinnedProxy' -count=1 -v
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Download e2e modules
        working-directory: e2e
        run: go mod download

      - name: Compile e2e tests
        working-directory: e2e
        run: |
          mkdir -p "${RUNNER_TEMP}/e2e-bin"
          go test -tags=e2e -c -o "${RUNNER_TEMP}/e2e-bin/" ./...

      - name: OpenAI e2e tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLMENTARY_BIN: ${{ github.workspace }}/bin/llmentary
        run: |
          set +e
          go test -v -tags=e2e -count=1 ./... | tee "${RUNNER_TEMP}/e2e.log"
          status=${PIPESTATUS[0]}
          echo "===== e2e tests that ran ====="
          grep -E '^=== RUN|^--- (PASS|FAIL|SKIP)' "${RUNNER_TEMP}/e2e.log" || true
          exit "$status"
        working-directory: e2e

  e2e-gate:
    name: e2e-gate
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require live e2e success
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bash scripts/e2e-gate.sh
