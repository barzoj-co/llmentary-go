# expect: secret OPENAI_API_KEY used raw in more than one step of job t; presence checks must use the boolean form
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: one
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo one
      - name: two
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo two
